name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every template points at a stack file in this repository that uses only the template's variables
        run: |
          jq -e '.version == "3" and (.templates | length > 0)' templates.json
          jq -c '.templates[]' templates.json | while read -r t; do
            file=$(jq -r '.repository.stackfile' <<<"$t")
            test "$(jq -r '.repository.url' <<<"$t")" = "https://github.com/$GITHUB_REPOSITORY"
            test -f "$file"
            for name in $(grep -o '\${[A-Z_]*' "$file" | cut -c3- | sort -u); do
              jq -e --arg n "$name" '[.env[].name] | index($n)' <<<"$t" >/dev/null || { echo "$file uses $name, which the template does not define"; exit 1; }
            done
          done
      - name: Start the Frameleaf stack as Portainer would
        run: |
          export DB_PASSWORD="ci$(openssl rand -hex 16)"
          docker compose -p frameleaf -f stacks/frameleaf.yml up -d --quiet-pull
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:2283/api/server/ping; then echo; break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:2283/api/server/version
          echo
          docker compose -p frameleaf -f stacks/frameleaf.yml exec -T frameleaf-server \
            node -e "fetch('http://frameleaf-machine-learning:3003/ping').then(r => r.text()).then(t => { console.log('machine learning:', t); if (t.trim() !== 'pong') process.exit(1) })"
      - name: Logs
        if: failure()
        run: docker compose -p frameleaf -f stacks/frameleaf.yml logs --tail 200
